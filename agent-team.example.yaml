version: 1

project:
  name: example-project
  defaultBranch: main
  stateDirectory: .agent-team
  maxParallel: 2

profiles:
  codex-planner:
    adapter: codex
    model: inherit
    reasoning: high
    permission: read-only
    externalTools: deny
    timeoutSeconds: 900

  codex-worker:
    adapter: codex
    model: inherit
    reasoning: medium
    permission: workspace-write
    externalTools: deny
    timeoutSeconds: 1800

  claude-reviewer:
    adapter: claude
    model: inherit
    reasoning: high
    permission: read-only
    externalTools: deny
    timeoutSeconds: 900

roles:
  orchestrator:
    defaultProfile: codex-planner
    allowedProfiles: [codex-planner]

  architect:
    defaultProfile: codex-planner
    allowedProfiles: [codex-planner, claude-reviewer]

  worker:
    defaultProfile: codex-worker
    allowedProfiles: [codex-worker]

  reviewer:
    defaultProfile: claude-reviewer
    allowedProfiles: [claude-reviewer, codex-planner]
    fallbackProfiles: [codex-planner]

  tester:
    defaultProfile: codex-planner
    allowedProfiles: [codex-planner]

strategies:
  default: balanced
  definitions:
    balanced:
      topology:
        mode: parallel-dag
      maxParallel: 2
      maxReworkAttempts: 2
      executionTimeoutSeconds: 14400
      maxAgentInvocations: 64
      maxProcessOutputBytes: 1048576
      maxArtifactBytes: 1073741824
      approvalGates: [final]
      approvalTimeoutSeconds: 86400
      roleProfiles: {}

    strict:
      topology:
        mode: sequential
      maxParallel: 1
      maxReworkAttempts: 3
      executionTimeoutSeconds: 21600
      maxAgentInvocations: 96
      maxProcessOutputBytes: 1048576
      maxArtifactBytes: 2147483648
      approvalGates: [plan, final]
      approvalTimeoutSeconds: 172800
      roleProfiles:
        reviewer: claude-reviewer
        tester: codex-planner

observability:
  maxEventsPerRun: 50000

quality:
  commands:
    - command: pnpm
      args: [check]
    - command: pnpm
      args: [test]
    - command: pnpm
      args: [build]
  maxReworkAttempts: 2
  commandTimeoutSeconds: 900

github:
  enabled: true
  remote: origin
  draftPullRequest: true
  autoMerge: false
  checkTimeoutSeconds: 1800
  maxRepairAttempts: 1
  repairForbiddenPaths:
    - .github/workflows/**
    - agent-team.yaml
