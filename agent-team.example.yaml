version: 1

project:
  name: example-project
  defaultBranch: main
  stateDirectory: .agent-team
  maxParallel: 2

profiles:
  # 每个角色至少配 2 个对象（Codex / Grok 或不同规格），便于 UI 切换与失败回退
  codex-orchestrator:
    adapter: codex
    model: gpt-5.6-sol
    reasoning: max
    permission: read-only
    externalTools: deny
    timeoutSeconds: 1800

  grok-orchestrator:
    adapter: grok
    model: grok-4.6
    reasoning: high
    permission: read-only
    externalTools: deny
    maxTurns: 20
    timeoutSeconds: 1800

  codex-architect:
    adapter: codex
    model: gpt-5.6-sol
    reasoning: xhigh
    permission: read-only
    externalTools: deny
    timeoutSeconds: 1800

  grok-architect:
    adapter: grok
    model: grok-4.6
    reasoning: high
    permission: read-only
    externalTools: deny
    maxTurns: 20
    timeoutSeconds: 1800

  codex-researcher:
    adapter: codex
    model: gpt-5.6-sol
    reasoning: high
    permission: read-only
    externalTools: deny
    timeoutSeconds: 1800

  grok-researcher:
    adapter: grok
    model: grok-4.6
    reasoning: high
    permission: read-only
    externalTools: deny
    maxTurns: 20
    timeoutSeconds: 1800

  grok-worker:
    adapter: grok
    model: grok-4.6
    reasoning: high
    permission: workspace-write
    externalTools: deny
    maxTurns: 16
    timeoutSeconds: 3600

  grok-worker-fast:
    adapter: grok
    model: grok-4.6
    reasoning: medium
    permission: workspace-write
    externalTools: deny
    maxTurns: 12
    timeoutSeconds: 1800

  codex-worker:
    adapter: codex
    model: gpt-5.6-sol
    reasoning: high
    permission: workspace-write
    externalTools: deny
    timeoutSeconds: 3600

  codex-reviewer:
    adapter: codex
    model: gpt-5.6-sol
    reasoning: xhigh
    permission: read-only
    externalTools: deny
    timeoutSeconds: 1800

  grok-reviewer:
    adapter: grok
    model: grok-4.6
    reasoning: high
    permission: read-only
    externalTools: deny
    maxTurns: 16
    timeoutSeconds: 1800

  codex-tester:
    adapter: codex
    model: gpt-5.6-sol
    reasoning: high
    permission: read-only
    externalTools: deny
    timeoutSeconds: 1200

  grok-tester:
    adapter: grok
    model: grok-4.6
    reasoning: high
    permission: read-only
    externalTools: deny
    maxTurns: 16
    timeoutSeconds: 1200

roles:
  orchestrator:
    defaultProfile: codex-orchestrator
    allowedProfiles: [codex-orchestrator, grok-orchestrator]
    fallbackProfiles: [grok-orchestrator]

  architect:
    defaultProfile: grok-architect
    allowedProfiles: [grok-architect, codex-architect]
    fallbackProfiles: [codex-architect]

  researcher:
    defaultProfile: grok-researcher
    allowedProfiles: [grok-researcher, codex-researcher]
    fallbackProfiles: [codex-researcher]
    promptFile: prompts/researcher.md

  worker:
    defaultProfile: grok-worker
    allowedProfiles: [grok-worker, grok-worker-fast, codex-worker]
    fallbackProfiles: [grok-worker-fast, codex-worker]
    promptFile: prompts/grok-worker.md

  reviewer:
    defaultProfile: grok-reviewer
    allowedProfiles: [grok-reviewer, codex-reviewer]
    fallbackProfiles: [codex-reviewer]

  tester:
    defaultProfile: grok-tester
    allowedProfiles: [grok-tester, codex-tester]
    fallbackProfiles: [codex-tester]

strategies:
  default: balanced
  definitions:
    balanced:
      topology:
        mode: parallel-dag
      maxParallel: 2
      maxReworkAttempts: 1
      executionTimeoutSeconds: 14400
      maxAgentInvocations: 48
      maxProcessOutputBytes: 1048576
      maxArtifactBytes: 1073741824
      approvalGates: [final]
      approvalTimeoutSeconds: 86400
      taskMorphology:
        explore:
          enabled: false
          maxInjectedChars: 4000
          failOpen: true
        implement:
          role: worker
          swarm:
            maxConcurrency: 2
      roleProfiles: {}

    strict:
      topology:
        mode: sequential
      maxParallel: 1
      maxReworkAttempts: 2
      executionTimeoutSeconds: 21600
      maxAgentInvocations: 72
      maxProcessOutputBytes: 1048576
      maxArtifactBytes: 2147483648
      approvalGates: [plan, final]
      approvalTimeoutSeconds: 172800
      taskMorphology:
        explore:
          enabled: true
          maxInjectedChars: 4000
          failOpen: false
        implement:
          role: worker
          swarm:
            maxConcurrency: 1
      roleProfiles:
        orchestrator: codex-orchestrator
        architect: codex-architect
        worker: grok-worker
        reviewer: codex-reviewer
        tester: codex-tester

observability:
  maxEventsPerRun: 50000

# Cross-project experience memory (candidates stay project-local until verified + shared)
experience:
  enabled: true
  injectIntoPlanning: true
  injectIntoRework: true
  extractOnTerminal: true
  maxInjected: 8
  # 为 true 时晋升须带 suiteDigest，或勾选强制晋升
  requireSuiteForPromote: false
  # 完成运行且能解析评测套件时，自动晋升低敏「成功/评测」候选
  autoPromoteWithSuite: true
  recordAttemptCards: true
  writeStrategyHints: true
  # sharedDirectory: /custom/path/to/experience/shared

evolution:
  automatic:
    enabled: false
    autoStart: false
    maxCycles: 3
    maxConsecutiveNoImprovement: 2
    evaluationRepeats: 1
    minimumScoreDelta: 1
    proposerRole: orchestrator
    proposerProfile: codex-orchestrator
    baselineStrategy: balanced
    targetStrategy: auto-evolved
    evaluationGoal: >-
      Improve one small, well-tested reliability issue without changing public
      behavior or release configuration. Run every configured quality command.

quality:
  commands:
    - command: pnpm
      args: [check]
    - command: pnpm
      args: [test]
    - command: pnpm
      args: [build]
    # Optional external gate (Alibaba Open Code Review) — install CLI first:
    #   npm i -g @alibaba-group/open-code-review
    # Uncomment only when ocr is on PATH; agent-team doctor will warn if missing.
    # - command: ocr
    #   args: [review]
  maxReworkAttempts: 1
  commandTimeoutSeconds: 900

github:
  enabled: true
  remote: origin
  draftPullRequest: true
  autoMerge: false
  checkTimeoutSeconds: 1800
  maxRepairAttempts: 1
  repairForbiddenPaths:
    - .github/workflows/**
    - agent-team.yaml
