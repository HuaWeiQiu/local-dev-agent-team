name: Desktop PR Build

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  build-desktop:
    name: desktop-${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - label: macos-x64
            platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - label: windows-x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
            rust-targets: ""

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: ${{ matrix.rust-targets }}
      - run: pnpm install --frozen-lockfile
      - name: Build unsigned desktop artifacts
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          AGENT_TEAM_TAURI_TARGET: ${{ matrix.target }}
        with:
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-[platform]-[arch]-[bundle]
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          args: ${{ matrix.args }}
