name: Coverage drift

# Nightly ledger guard, never a merge gate.
#
# The quality job in CI runs `pnpm check/lint/test/build` without coverage, so CRAP
# drift is invisible there: the ledger can grow for weeks and only a human running
# the gate by hand would notice. This job makes that drift visible once a day
# without adding minutes (or a new failure mode) to every pull request.
#
# It reports two kinds of trouble, and never mixes them: a scan that could not run
# is `infrastructure` (the #143 class), a grown ledger is `ledger`. Both land in an
# issue; neither blocks a merge.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      coverage_source:
        description: "覆盖率来源：existing = 复用上一步的单 worker lcov（推荐，可复现）；self = crapper 自取（并行采集，会抖）"
        type: choice
        options: [existing, self]
        default: existing

permissions:
  contents: read
  issues: write

# The scan reads coverage reports from the working tree. Two runs sharing that
# directory is exactly the #143 failure mode, so this job never runs beside itself.
concurrency:
  group: coverage-drift
  cancel-in-progress: false

jobs:
  drift:
    # Pinned to the machine that produces the baseline: same OS family (arm64 macOS),
    # same Node major. A guard that measures on a different platform reports drift
    # that is really the platform. Measured: same code, same tool commit, Linux+Node24
    # gave 5/6/4 against a macOS+Node26 baseline of 0/2/3.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          # The baseline is computed under this Node. CRAP moves with V8 coverage
          # instrumentation, so the version is part of the measurement, not a detail.
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Two things this line has to get right, both learned the hard way:
      #   - `pnpm test -- --coverage` does NOT enable coverage: the `--` is forwarded
      #     verbatim and vitest reads `--coverage` as a filename filter;
      #   - `--coverage` alone does not write lcov: the default reporters are
      #     text/html/clover/json, so a lcov-only reader finds nothing.
      # The step stays non-fatal so a broken run is reported, not hidden.
      # One worker on purpose. With parallel workers the coverage collector loses a
      # worker's data now and then: two full runs of the same commit differed on 11 lines
      # (`EvolutionWorkbench` 8 hits vs 0, `stall.ts` 0 vs 1), while two single-worker
      # runs produced byte-identical signatures (`bd97fec5…`). Measurement may be slower
      # than CI; CI has to be fast, a ledger has to be right.
      - name: Collect coverage
        id: coverage
        continue-on-error: true
        run: >-
          pnpm exec vitest run --coverage
          --coverage.reporter=lcov
          --coverage.reporter=text-summary
          --maxWorkers=1

      # A missing coverage report must never be read as "every function is at 0%",
      # which is a whole ledger of new debt invented by a failed measurement.
      - name: Refuse to score a run that produced no coverage
        id: coverage_gate
        env:
          COVERAGE_OUTCOME: ${{ steps.coverage.outcome }}
        run: |
          set -euo pipefail
          lcov="target/coverage/typescript/lcov.info"
          # A report from a run that failed is a partial measurement: the functions
          # behind the failing tests look uncovered, and 0% coverage turns every one
          # of them into invented debt (measured: a failed run here reported 1545
          # "new" functions). Only a completed run may be scored.
          if [ -s "$lcov" ] && [ "${{ steps.coverage.outcome }}" = "success" ]; then
            echo "report=$(wc -c < "$lcov") bytes" >> "$GITHUB_OUTPUT"
            echo "coverage report: $(wc -c < "$lcov") bytes" >> "$GITHUB_STEP_SUMMARY"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            node -e '
              const { writeFileSync } = require("node:fs");
              const outcome = process.env.COVERAGE_OUTCOME;
              const reason = outcome === "success"
                ? "coverage report missing at target/coverage/typescript/lcov.info"
                : `coverage run did not succeed (${outcome}); a partial report would invent debt`;
              writeFileSync("drift-report.json", JSON.stringify({
                kind: "infrastructure",
                generatedAt: new Date().toISOString(),
                threshold: 10,
                baseline: ".ub-crap-baseline.json",
                error: reason,
                counts: { new: 0, worse: 0, fixed: 0 },
                new: [], worse: [], fixed: [],
              }, null, 2) + "\n");
            '
            echo "coverage report missing: reported as infrastructure" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Third-party tool chain, pinned: a moving HEAD would change how every score is
      # computed without anything in this repository changing. The pinned commit is
      # the one the local tool chain reports.
      - name: Install the ub-mode tool chain
        continue-on-error: true
        run: |
          set -euo pipefail
          git clone https://github.com/unclebob/crapper.git "$RUNNER_TEMP/crapper"
          git -C "$RUNNER_TEMP/crapper" checkout 6fd92c4
          git -C "$RUNNER_TEMP/crapper" rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
          chmod +x "$RUNNER_TEMP/crapper/crapper"
          printf '%s\n' \
            '#!/bin/sh' \
            'tool=$1; shift' \
            '[ "$tool" = "crapper" ] || { echo "unsupported tool: $tool" >&2; exit 1; }' \
            'exec "$CRAPPER_BIN" "$@"' > "$RUNNER_TEMP/ub"
          chmod +x "$RUNNER_TEMP/ub"
          echo "UB_BIN=$RUNNER_TEMP/ub" >> "$GITHUB_ENV"
          echo "CRAPPER_BIN=$RUNNER_TEMP/crapper/crapper" >> "$GITHUB_ENV"

      # The verdict is the JSON file, not the exit code: a crashed scan writes
      # `kind: "infrastructure"` and exits non-zero, which is a finding, not a job
      # failure. Only the issue step below is allowed to fail the job.
      - name: Build the drift report
        if: steps.coverage_gate.outputs.available == 'true'
        continue-on-error: true
        env:
          # The baseline is refreshed with crapper collecting its own coverage, so the
          # nightly defaults to the same source: a guard that measures differently from
          # the thing it ratchets reports drift that is really just method.
          COVERAGE_SOURCE: ${{ inputs.coverage_source || 'existing' }}
        run: |
          set -euo pipefail
          args=(--all --drift-report drift-report.json)
          if [ -n "${UB_BIN:-}" ]; then args+=(--ub "$UB_BIN"); fi
          if [ "$COVERAGE_SOURCE" = "existing" ]; then args+=(-- --use-existing-coverage); fi
          echo "coverage source: $COVERAGE_SOURCE" >> "$GITHUB_STEP_SUMMARY"
          node scripts/ub-quality-gate.mjs "${args[@]}"

      # Attribution, not a gate. The report above says the ledger grew; this says why, for
      # exactly the keys that grew, by asking whether the same command produces the same
      # score again. It is gated on `new > 0` because every cell is a full suite run: three
      # runs are worth paying for when debt appeared, and a waste on a night that reported
      # nothing. `continue-on-error` plus an exit-0 contract means even a broken measurement
      # is a line in the issue rather than a red job — a red X on a step that only explains
      # things teaches people to ignore red Xs.
      - name: Attribute the new debt
        if: steps.coverage_gate.outputs.available == 'true'
        continue-on-error: true
        timeout-minutes: 45
        run: node scripts/coverage-caliber-attribution.mjs drift-report.json caliber-attribution.json

      - name: Open or update the drift issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/coverage-drift-issue.mjs drift-report.json caliber-attribution.json

      - name: Keep the report for triage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-drift-report
          path: |
            drift-report.json
            caliber-attribution.json
          if-no-files-found: warn
