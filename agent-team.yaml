version: 1

project:
  name: local-dev-agent-team
  defaultBranch: main
  stateDirectory: .agent-team
  maxParallel: 3

profiles:
  # —— 总控（只读）——
  codex-orchestrator:
    adapter: codex
    model: gpt-5.6-sol
    reasoning: max
    permission: read-only
    externalTools: deny
    codexProvider:
      id: sub2api
      baseUrl: https://sub2api.ktyun.cc
      wireApi: responses
      requiresOpenAIAuth: true
      supportsWebSockets: false
    timeoutSeconds: 1800

  grok-orchestrator:
    adapter: grok
    model: grok
    reasoning: high
    permission: read-only
    externalTools: deny
    maxTurns: 20
    timeoutSeconds: 1800

  # —— 架构（只读）——
  grok-architect:
    adapter: grok
    model: grok
    reasoning: high
    permission: read-only
    externalTools: deny
    maxTurns: 20
    timeoutSeconds: 1800

  codex-architect:
    adapter: codex
    model: gpt-5.6-sol
    reasoning: xhigh
    permission: read-only
    externalTools: deny
    codexProvider:
      id: sub2api
      baseUrl: https://sub2api.ktyun.cc
      wireApi: responses
      requiresOpenAIAuth: true
      supportsWebSockets: false
    timeoutSeconds: 1800

  # —— 审查（只读）——
  grok-reviewer:
    adapter: grok
    model: grok
    reasoning: high
    permission: read-only
    externalTools: deny
    maxTurns: 16
    timeoutSeconds: 1800

  codex-reviewer:
    adapter: codex
    model: gpt-5.6-sol
    reasoning: xhigh
    permission: read-only
    externalTools: deny
    codexProvider:
      id: sub2api
      baseUrl: https://sub2api.ktyun.cc
      wireApi: responses
      requiresOpenAIAuth: true
      supportsWebSockets: false
    timeoutSeconds: 1800

  # —— 测试（只读）——
  grok-tester:
    adapter: grok
    model: grok
    reasoning: high
    permission: read-only
    externalTools: deny
    maxTurns: 16
    timeoutSeconds: 1800

  codex-tester:
    adapter: codex
    model: gpt-5.6-sol
    reasoning: high
    permission: read-only
    externalTools: deny
    codexProvider:
      id: sub2api
      baseUrl: https://sub2api.ktyun.cc
      wireApi: responses
      requiresOpenAIAuth: true
      supportsWebSockets: false
    timeoutSeconds: 1200

  # —— 执行者（可写）——
  grok-worker:
    adapter: grok
    model: grok
    reasoning: high
    permission: workspace-write
    externalTools: deny
    maxTurns: 24
    timeoutSeconds: 3600

  grok-worker-fast:
    adapter: grok
    model: grok
    reasoning: medium
    permission: workspace-write
    externalTools: deny
    maxTurns: 12
    timeoutSeconds: 1800

  grok-worker-heavy:
    adapter: grok
    model: grok
    reasoning: high
    permission: workspace-write
    externalTools: deny
    maxTurns: 32
    timeoutSeconds: 5400

  codex-worker:
    adapter: codex
    model: gpt-5.6-sol
    reasoning: high
    permission: workspace-write
    externalTools: deny
    codexProvider:
      id: sub2api
      baseUrl: https://sub2api.ktyun.cc
      wireApi: responses
      requiresOpenAIAuth: true
      supportsWebSockets: false
    timeoutSeconds: 3600

roles:
  # 每个角色可在「角色配置覆盖」里切换；默认仍是：总控 Codex，其余 Grok
  orchestrator:
    defaultProfile: codex-orchestrator
    allowedProfiles: [codex-orchestrator, grok-orchestrator]
    fallbackProfiles: [grok-orchestrator]

  architect:
    defaultProfile: grok-architect
    allowedProfiles: [grok-architect, codex-architect]
    fallbackProfiles: [codex-architect]

  worker:
    defaultProfile: grok-worker
    allowedProfiles: [grok-worker, grok-worker-fast, grok-worker-heavy, codex-worker]
    fallbackProfiles: [grok-worker-fast, codex-worker]
    promptFile: prompts/grok-worker.md

  reviewer:
    defaultProfile: grok-reviewer
    allowedProfiles: [grok-reviewer, codex-reviewer]
    fallbackProfiles: [codex-reviewer]

  tester:
    defaultProfile: grok-tester
    allowedProfiles: [grok-tester, codex-tester]
    fallbackProfiles: [codex-tester]

strategies:
  default: balanced
  definitions:
    balanced:
      topology:
        mode: parallel-dag
      maxParallel: 3
      maxReworkAttempts: 1
      executionTimeoutSeconds: 21600
      maxAgentInvocations: 64
      maxProcessOutputBytes: 1048576
      maxArtifactBytes: 2147483648
      approvalGates: [final]
      approvalTimeoutSeconds: 172800
      # explore / plan / coder swarm 形态（Kimi 映射）
      taskMorphology:
        explore:
          enabled: false
          maxInjectedChars: 4000
          failOpen: true
        plan:
          role: architect
        implement:
          role: worker
          swarm:
            maxConcurrency: 3
      roleProfiles:
        orchestrator: codex-orchestrator
        architect: grok-architect
        worker: grok-worker
        reviewer: grok-reviewer
        tester: grok-tester

    strict:
      topology:
        mode: sequential
      maxParallel: 1
      maxReworkAttempts: 2
      executionTimeoutSeconds: 43200
      maxAgentInvocations: 72
      maxProcessOutputBytes: 1048576
      maxArtifactBytes: 4294967296
      approvalGates: [plan, final]
      approvalTimeoutSeconds: 172800
      taskMorphology:
        explore:
          enabled: true
          maxInjectedChars: 4000
          failOpen: false
        plan:
          role: architect
        implement:
          role: worker
          swarm:
            maxConcurrency: 1
      roleProfiles:
        orchestrator: codex-orchestrator
        architect: grok-architect
        worker: grok-worker
        reviewer: grok-reviewer
        tester: grok-tester

observability:
  maxEventsPerRun: 50000

evaluation:
  suiteFile: evaluation/suite.example.yaml

evolution:
  automatic:
    enabled: true
    autoStart: false
    maxCycles: 3
    maxConsecutiveNoImprovement: 2
    evaluationRepeats: 1
    minimumScoreDelta: 1
    proposerRole: orchestrator
    proposerProfile: codex-orchestrator
    baselineStrategy: balanced
    targetStrategy: auto-evolved
    evaluationGoal: >-
      Improve one small, well-tested reliability issue in this repository without
      changing public behavior or release configuration. Run every configured quality
      command and leave the result ready for independent review.

quality:
  commands:
    - command: pnpm
      args: [check]
    - command: pnpm
      args: [test]
    - command: pnpm
      args: [build]
  maxReworkAttempts: 1
  commandTimeoutSeconds: 900

github:
  enabled: true
  remote: origin
  draftPullRequest: true
  autoMerge: false
  checkTimeoutSeconds: 1800
  maxRepairAttempts: 1
  repairForbiddenPaths:
    - .github/workflows/**
    - agent-team.yaml
