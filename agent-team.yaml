version: 1

project:
  name: local-dev-agent-team
  defaultBranch: main
  stateDirectory: .agent-team
  maxParallel: 3

profiles:
  # 总控：Codex gpt-5.6-sol
  codex-orchestrator:
    adapter: codex
    model: gpt-5.6-sol
    reasoning: max
    permission: read-only
    externalTools: deny
    codexProvider:
      id: sub2api
      baseUrl: https://sub2api.ktyun.cc
      wireApi: responses
      requiresOpenAIAuth: true
      supportsWebSockets: false
    timeoutSeconds: 1800

  # 架构 / 审查 / 测试：Grok read-only
  grok-architect:
    adapter: grok
    model: grok
    reasoning: high
    permission: read-only
    externalTools: deny
    maxTurns: 20
    timeoutSeconds: 1800

  grok-reviewer:
    adapter: grok
    model: grok
    reasoning: high
    permission: read-only
    externalTools: deny
    maxTurns: 16
    timeoutSeconds: 1800

  grok-tester:
    adapter: grok
    model: grok
    reasoning: high
    permission: read-only
    externalTools: deny
    maxTurns: 16
    timeoutSeconds: 1800

  # 多执行者：默认 / 轻量 / 重任务
  grok-worker:
    adapter: grok
    model: grok
    reasoning: high
    permission: workspace-write
    externalTools: deny
    maxTurns: 24
    timeoutSeconds: 3600

  grok-worker-fast:
    adapter: grok
    model: grok
    reasoning: medium
    permission: workspace-write
    externalTools: deny
    maxTurns: 12
    timeoutSeconds: 1800

  grok-worker-heavy:
    adapter: grok
    model: grok
    reasoning: high
    permission: workspace-write
    externalTools: deny
    maxTurns: 32
    timeoutSeconds: 5400

roles:
  orchestrator:
    defaultProfile: codex-orchestrator
    allowedProfiles: [codex-orchestrator]

  architect:
    defaultProfile: grok-architect
    allowedProfiles: [grok-architect]

  worker:
    defaultProfile: grok-worker
    allowedProfiles: [grok-worker, grok-worker-fast, grok-worker-heavy]
    promptFile: prompts/grok-worker.md

  reviewer:
    defaultProfile: grok-reviewer
    allowedProfiles: [grok-reviewer]

  tester:
    defaultProfile: grok-tester
    allowedProfiles: [grok-tester]

strategies:
  default: balanced
  definitions:
    balanced:
      topology:
        mode: parallel-dag
      maxParallel: 3
      maxReworkAttempts: 1
      executionTimeoutSeconds: 21600
      maxAgentInvocations: 64
      maxProcessOutputBytes: 1048576
      maxArtifactBytes: 2147483648
      approvalGates: [final]
      approvalTimeoutSeconds: 172800
      roleProfiles:
        orchestrator: codex-orchestrator
        architect: grok-architect
        worker: grok-worker
        reviewer: grok-reviewer
        tester: grok-tester

    strict:
      topology:
        mode: sequential
      maxParallel: 1
      maxReworkAttempts: 2
      executionTimeoutSeconds: 43200
      maxAgentInvocations: 72
      maxProcessOutputBytes: 1048576
      maxArtifactBytes: 4294967296
      approvalGates: [plan, final]
      approvalTimeoutSeconds: 172800
      roleProfiles:
        orchestrator: codex-orchestrator
        architect: grok-architect
        worker: grok-worker
        reviewer: grok-reviewer
        tester: grok-tester

observability:
  maxEventsPerRun: 50000

evaluation:
  suiteFile: evaluation/suite.example.yaml

evolution:
  automatic:
    enabled: true
    autoStart: false
    maxCycles: 3
    maxConsecutiveNoImprovement: 2
    evaluationRepeats: 1
    minimumScoreDelta: 1
    proposerRole: orchestrator
    proposerProfile: codex-orchestrator
    baselineStrategy: balanced
    targetStrategy: auto-evolved
    evaluationGoal: >-
      Improve one small, well-tested reliability issue in this repository without
      changing public behavior or release configuration. Run every configured quality
      command and leave the result ready for independent review.

quality:
  commands:
    - command: pnpm
      args: [check]
    - command: pnpm
      args: [test]
    - command: pnpm
      args: [build]
  maxReworkAttempts: 1
  commandTimeoutSeconds: 900

github:
  enabled: true
  remote: origin
  draftPullRequest: true
  autoMerge: false
  checkTimeoutSeconds: 1800
  maxRepairAttempts: 1
  repairForbiddenPaths:
    - .github/workflows/**
    - agent-team.yaml
