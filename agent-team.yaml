version: 1

project:
  name: local-dev-agent-team
  defaultBranch: main
  stateDirectory: .agent-team
  maxParallel: 2

profiles:
  codex-planner:
    adapter: codex
    model: inherit
    reasoning: high
    permission: read-only
    timeoutSeconds: 900

  codex-worker:
    adapter: codex
    model: inherit
    reasoning: medium
    permission: workspace-write
    timeoutSeconds: 1800

  claude-reviewer:
    adapter: claude
    model: inherit
    reasoning: high
    permission: read-only
    timeoutSeconds: 900

roles:
  orchestrator:
    defaultProfile: codex-planner
    allowedProfiles: [codex-planner]

  architect:
    defaultProfile: codex-planner
    allowedProfiles: [codex-planner, claude-reviewer]

  worker:
    defaultProfile: codex-worker
    allowedProfiles: [codex-worker]

  reviewer:
    defaultProfile: claude-reviewer
    allowedProfiles: [claude-reviewer, codex-planner]
    fallbackProfiles: [codex-planner]

  tester:
    defaultProfile: codex-planner
    allowedProfiles: [codex-planner]

quality:
  commands:
    - command: pnpm
      args: [check]
    - command: pnpm
      args: [test]
    - command: pnpm
      args: [build]
  maxReworkAttempts: 2
  commandTimeoutSeconds: 900

github:
  enabled: true
  remote: origin
  draftPullRequest: true
  autoMerge: false
  checkTimeoutSeconds: 1800
  maxRepairAttempts: 1
  repairForbiddenPaths:
    - .github/workflows/**
    - agent-team.yaml
