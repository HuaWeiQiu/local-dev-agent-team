[package]
name = "agent-team-desktop"
version = "0.1.0"
description = "Desktop shell for the Agent Team local control plane"
authors = ["Agent Team contributors"]
edition = "2021"

[lib]
name = "agent_team_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"
